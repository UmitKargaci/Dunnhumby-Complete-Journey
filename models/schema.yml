version: 2

sources:
  - name: raw
    database: fifth-howl-508817-h0
    schema: raw
    description: Dunnhumby Complete Journey ham verisi (2.500 hane, 102 hafta), Drive'dan kalıcı tabloya kopyalandı
    tables:

      - name: transaction_data
        description: satır bazlı satış işlemleri (hane × sepet × ürün)
        columns:
          - name: household_key
            description: hane anahtarı
            data_tests:
              - not_null
          - name: BASKET_ID
            description: sepet kimliği
            data_tests:
              - not_null
          - name: DAY
            description: gün sayacı (1–711), gerçek tarih değil
            data_tests:
              - not_null
          - name: PRODUCT_ID
            description: ürün kimliği
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'product')
                    field: PRODUCT_ID
          - name: QUANTITY
            description: adet
            data_tests:
              - not_null   
          - name: SALES_VALUE
            description: satış tutarı 
            data_tests:
              - not_null   
          - name: STORE_ID
            description: mağaza kimliği
            data_tests:
              - not_null   
          - name: RETAIL_DISC
            description: mağaza indirimi (negatif; 36 satırda pozitif, stg_'de düzeltiliyor)
          - name: TRANS_TIME
            description: işlem saati, HHMM
          - name: WEEK_NO
            description: hafta numarası (1–102)
            data_tests:
              - not_null   
          - name: COUPON_DISC
            description: üretici kupon indirimi (negatif)
          - name: COUPON_MATCH_DISC
            description: mağazanın eşlediği kupon indirimi (negatif)

      - name: product
        description: ürün hiyerarşisi ve marka bilgisi
        columns:
          - name: PRODUCT_ID
            description: ürün kimliği
            data_tests:
              - unique
              - not_null
          - name: MANUFACTURER
            description: üretici kodu
          - name: DEPARTMENT
            description: reyon (KIOSK-GAS = akaryakıt)
            data_tests:
              - not_null:   
                  config:
                    severity: warn
          - name: BRAND
            description: National / Private
            data_tests:
              - accepted_values:   
                  arguments:
                    values: ['National', 'Private']
                  config:
                    severity: warn
          - name: COMMODITY_DESC
            description: ürün grubu (sepet analizinin birimi)
          - name: SUB_COMMODITY_DESC
            description: alt ürün grubu
          - name: CURR_SIZE_OF_PRODUCT
            description: ürün boyutu (yaklaşık %33'ü boş)

      - name: hh_demographic
        description: hane demografisi (2.500 hanenin 801'i, modellere girmiyor)
        columns:
          - name: household_key
            description: hane anahtarı
            data_tests:
              - unique
              - not_null
          - name: AGE_DESC
            description: yaş aralığı
          - name: MARITAL_STATUS_CODE
            description: medeni durum kodu
          - name: INCOME_DESC
            description: gelir aralığı
          - name: HOMEOWNER_DESC
            description: ev sahipliği (Unknown değerler stg_'de NULL yapılıyor)
          - name: HH_COMP_DESC
            description: hane kompozisyonu (Unknown değerler stg_'de NULL yapılıyor)
          - name: HOUSEHOLD_SIZE_DESC
            description: hane büyüklüğü
          - name: KID_CATEGORY_DESC
            description: çocuk kategorisi

      - name: campaign_desc
        description: kampanya tipi ve tarihleri
        columns:
          - name: CAMPAIGN
            description: kampanya kimliği
            data_tests:
              - unique
              - not_null
          - name: DESCRIPTION
            description: kampanya tipi
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['TypeA', 'TypeB', 'TypeC']
          - name: START_DAY
            description: başlangıç günü (gün sayacı)
            data_tests:
              - not_null
          - name: END_DAY
            description: bitiş günü (gün sayacı)
            data_tests:
              - not_null

      - name: campaign_table
        description: hangi hanenin hangi kampanyayı aldığı (sınıflandırma modelinin satır tabanı)
        data_tests:
          - unique:
              arguments:
                column_name: "concat(cast(household_key as string), '-', cast(CAMPAIGN as string))"
        columns:
          - name: household_key
            description: hane anahtarı
            data_tests:
              - not_null
          - name: CAMPAIGN
            description: kampanya kimliği
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'campaign_desc')
                    field: CAMPAIGN
          - name: DESCRIPTION
            description: kampanya tipi
            data_tests:
              - accepted_values:   
                  arguments:
                    values: ['TypeA', 'TypeB', 'TypeC']

      - name: coupon
        description: kampanya başına kupon ve geçerli olduğu ürünler
        data_tests:
          - unique:
              arguments:
                column_name: "concat(cast(COUPON_UPC as string), '-', cast(PRODUCT_ID as string), '-', cast(CAMPAIGN as string))"
              config:
                severity: warn   
        columns:
          - name: COUPON_UPC
            description: kupon kimliği
            data_tests:
              - not_null
          - name: PRODUCT_ID
            description: kuponun geçerli olduğu ürün
            data_tests:
              - not_null
              - relationships:   
                  arguments:
                    to: source('raw', 'product')
                    field: PRODUCT_ID
                  config:
                    severity: warn
          - name: CAMPAIGN
            description: kampanya kimliği
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'campaign_desc')
                    field: CAMPAIGN

      - name: coupon_redempt
        description: kupon kullanımları (sınıflandırma hedefi REDEEMED buradan geliyor)
        columns:
          - name: household_key
            description: hane anahtarı
            data_tests:
              - not_null
              - relationships:   
                  arguments:
                    to: source('raw', 'campaign_table')
                    field: household_key
                  config:
                    severity: warn
          - name: DAY
            description: kullanım günü (gün sayacı)
            data_tests:
              - not_null
          - name: COUPON_UPC
            description: kupon kimliği
            data_tests:
              - not_null
              - relationships:   
                  arguments:
                    to: source('raw', 'coupon')
                    field: COUPON_UPC
                  config:
                    severity: warn
          - name: CAMPAIGN
            description: kampanya kimliği
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'campaign_desc')
                    field: CAMPAIGN

      - name: causal_data
        description: ürün × mağaza × hafta teşhir ve broşür bilgisi (36,8 M satır, ana akışta kullanılmıyor)